[project]
name = "hol-language-server"
version = "0.1.0"
description = "Static lookup for HOL Light sources: a parser and index of definitions and loads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hol_language_server_core"]

[tool.ruff]
extend-exclude = ["_work"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbe
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["I001"]

[tool.pyright]
include = ["."]
exclude = ["**/.*", "**/__pycache__", "_work"]
extraPaths = ["."]
typeCheckingMode = "standard"
reportUnusedCallResult = "none"
# Every parameter and return carries a type.
reportMissingParameterType = "error"
reportUnknownParameterType = "error"
reportMissingTypeArgument = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"
