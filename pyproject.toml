[project]
name = "hol-language-server"
version = "0.1.0"
description = "Static lookup for HOL Light sources: a language server over a parser and index of definitions and loads"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lsprotocol>=2025.0.0",
    "pygls>=2.1.1",
]

[project.scripts]
hol-language-server = "lsp_server:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The server is a top-level module beside the package it uses.
only-include = ["hol_language_server_core", "lsp_server.py"]

[tool.ruff]
extend-exclude = ["_work"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbe
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["I001"]

[tool.pytest.ini_options]
# The repository root on the path, so `hol_language_server_core` imports;
# tests/ for the fixture paths.
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.pyright]
include = ["."]
exclude = ["**/.*", "**/__pycache__", "_work"]
# The same paths as [tool.pytest.ini_options].
extraPaths = [".", "tests"]
typeCheckingMode = "standard"
reportUnusedCallResult = "none"
# Every parameter and return carries a type.
reportMissingParameterType = "error"
reportUnknownParameterType = "error"
reportMissingTypeArgument = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryIsInstance = "error"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest>=9.1.1",
]
